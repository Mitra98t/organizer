name: organizer

services:
  app:
    build: .
    image: organizer:latest
    restart: unless-stopped
    # Only on this computer (127.0.0.1): no port open to the network. From outside one goes through the tunnel.
    # To make it reachable on the local network: APP_BIND=0.0.0.0 in the .env file.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      TRASH_DAYS: ${TRASH_DAYS:-30}
      # Behind Cloudflare the real address of whoever connects arrives in this header (used by the login
      # attempts limit). It is used only if present; the app cannot be reached from outside except through the tunnel.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
    volumes:
      - organizer-data:/data

  # Access from the internet with your domain, without opening ports: Cloudflare Tunnel. cloudflared opens an
  # outgoing connection to Cloudflare, which passes the requests for the domain through it (HTTPS included).
  # The tunnel token goes in the .env file (TUNNEL_TOKEN=…), never in the repository. Start: make tunnel
  # In the Cloudflare dashboard the tunnel's "public hostname" points to http://app:8080.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

  # HTTPS in front of the app (needed to install the PWA on Android and for offline use).
  # Start:  docker compose --profile https up -d
  # Locally it uses Caddy's internal CA; with a real domain (SITE_ADDRESS=todo.example.com
  # and CADDY_TLS="tls you@example.com") it gets a Let's Encrypt certificate automatically.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-tls internal}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

# Inline (not a mounted file) so it works even where Docker does not share the project folder.
# "$$" = a literal "$": Caddy resolves the variables at startup, not compose.
configs:
  caddyfile:
    content: |
      {$$SITE_ADDRESS} {
      	{$$CADDY_TLS}
      	encode gzip
      	reverse_proxy app:8080
      }

volumes:
  organizer-data:
  caddy-data:
  caddy-config:
