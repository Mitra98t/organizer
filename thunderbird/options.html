<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px/1.45 system-ui, sans-serif; margin: 16px; max-width: 560px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    label.check { font-weight: 400; display: flex; gap: 8px; align-items: center; margin-top: 16px; }
    label.check input { width: auto; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    button { margin-top: 14px; padding: 6px 14px; font: inherit; }
    .muted { color: #777; font-size: 13px; }
    #status { margin-top: 16px; padding: 8px 10px; border-radius: 6px; background: #eee; }
    #status.on { background: #dff3e4; }
    #status.error { background: #fbe3e1; }
    #accounts { margin-top: 6px; }
    .acc { display: flex; gap: 10px; align-items: center; margin: 6px 0; }
    .acc span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acc select { flex: 1; padding: 4px 6px; font: inherit; }
  </style>
</head>
<body>
  <h2>Organizer</h2>
  <p class="muted" data-i18n="optIntro"></p>
  <label for="server" data-i18n="optServer"></label>
  <input id="server" placeholder="https://organizer.example.com" autocomplete="off">
  <label for="token" data-i18n="optToken"></label>
  <input id="token" type="password" placeholder="org_…" autocomplete="off">
  <p class="muted" data-i18n="optTokenHelp"></p>
  <label class="check"><input id="inbox" type="checkbox" checked> <span data-i18n="optInbox"></span></label>
  <p class="muted" data-i18n="optInboxHelp"></p>
  <button id="save" data-i18n="optSave"></button>
  <div id="status"></div>
  <label data-i18n="optAccounts"></label>
  <p class="muted" data-i18n="optAccountsHelp"></p>
  <div id="accounts" class="muted" data-i18n="optConnectFirst"></div>
  <script src="options.js"></script>
</body>
</html>
